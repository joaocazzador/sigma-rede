[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigma"
version = "0.0.0"
description = "Sigma network and local app for distributed AI hosting and mining."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "License pending selection by project owner" }
authors = [{ name = "Sigma Project" }]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]
