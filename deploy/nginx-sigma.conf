# Site do Sigma no nginx. O certbot acrescenta o bloco HTTPS depois.
# Atenção: o deploy_vps.sh só instala este arquivo na primeira vez (depois o certbot passa a editá-lo);
# mudanças aqui valem para instalações novas ou precisam ser copiadas à mão no servidor.
# Cada app consulta o nó a cada poucos segundos, e várias casas podem sair pelo mesmo IP: o limite é por
# IP, com folga. Relatórios de mineração, transações e arquivos já têm limites próprios no nó (--public),
# contados pelo IP que vem no X-Forwarded-For abaixo. Quem passa do limite recebe 429 (o app espera e tenta
# de novo), não 503 (que pareceria o nó fora do ar).
limit_req_zone $binary_remote_addr zone=sigma_rpc:10m rate=30r/s;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 21m;   # blobs de até 20 MB (arquivos de sites); /tx e /rpc o nó corta em 256 KB

    location / {
        limit_req zone=sigma_rpc burst=120 nodelay;
        proxy_pass http://127.0.0.1:8700;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # um valor só: o nó confia no último
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

